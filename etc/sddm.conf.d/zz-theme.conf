# Managed by ~/.dotfiles/theme — installed to /etc/sddm.conf.d/ by install.sh.
# Named "zz-" so it sorts AFTER kde_settings.conf and wins the [Theme] Current key
# (SDDM merges drop-ins alphabetically; last value read wins).
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=silent
CursorTheme=catppuccin-latte-peach-cursors
CursorSize=24
