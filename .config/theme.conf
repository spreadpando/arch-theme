# The one place to set your look. Edit, then run:  theme-apply
#
# theme-apply fans these out to GTK3/4, Qt (qt6ct), dconf (libadwaita) and the
# wallpaper/cursor — in both i3 and Hyprland. Nothing else to touch.
#
# gtk_theme and qt_style are separate on purpose: a GTK theme name can't be used
# by Qt. qt_style options installed here: Breeze, Oxygen, Fusion, Windows.
# (For Qt to actually match a GTK theme like Graphite, install `kvantum` + the
#  theme's Kvantum variant and set  qt_style = kvantum-dark .)

wallpaper   = ~/Pictures/wallpapers/night-battlefield.png
# wallpaper_speed only applies to video wallpapers (Hyprland/mpvpaper): playback rate, 1 = normal
wallpaper_speed = 0.1
gtk_theme   = Graphite-Dark
qt_style    = Adwaita-Dark
icon_theme  = breeze-dark
cursor      = catppuccin-latte-peach-cursors
cursor_size = 24
font        = Hack 10
