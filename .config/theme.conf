# The one place to set your look. Edit, then run:  theme-apply
#
# theme-apply fans these out to GTK3/4, Qt (qt6ct), dconf (libadwaita) and the
# wallpaper/cursor — in both i3 and Hyprland. Nothing else to touch.

wallpaper   = ~/Pictures/wallpapers/art002e009301~orig.jpg
ui_theme    = Graphite-Dark
icon_theme  = breeze-dark
cursor      = catppuccin-latte-peach-cursors
cursor_size = 24
font        = Hack 10
